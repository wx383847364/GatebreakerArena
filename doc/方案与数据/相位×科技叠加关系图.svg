<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Fusion Pixel CN','Press Start 2P',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6fb8ff"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ffb454"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="680" height="470" fill="url(#bg)"/>
  <!-- 六边形场域边框 -->
  <polygon points="14,40 340,14 666,40 666,430 340,456 14,430" fill="none" stroke="#1c3a5e" stroke-width="2"/>

  <!-- 标题 -->
  <text x="340" y="36" text-anchor="middle" fill="#eafcff" font-size="20" filter="url(#glow)">相位效果 × 科技效果 — 叠加关系</text>
  <text x="340" y="58" text-anchor="middle" fill="#7fa8c8" font-size="11">§5.6 两种组合方式可视化（共存且组合生效，非互斥/覆盖）</text>

  <!-- 分隔 -->
  <line x1="340" y1="74" x2="340" y2="392" stroke="#1c3a5e" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ===== 列 A：正交叠加 ===== -->
  <g>
    <rect x="22" y="80" width="306" height="34" rx="6" fill="#0e2236" stroke="#3df0ff" stroke-width="2" filter="url(#glow)"/>
    <text x="175" y="102" text-anchor="middle" fill="#3df0ff" font-size="14">A. 正交叠加（不同轴）</text>

    <rect x="34" y="148" width="130" height="54" rx="6" fill="#0e2236" stroke="#3df0ff" stroke-width="1.5"/>
    <text x="99" y="170" text-anchor="middle" fill="#bfeaff" font-size="12">相位 · 机制轴</text>
    <text x="99" y="188" text-anchor="middle" fill="#7fb8d8" font-size="10">何时触发·数量·阈值</text>

    <rect x="238" y="148" width="130" height="54" rx="6" fill="#0e2236" stroke="#3df0ff" stroke-width="1.5"/>
    <text x="303" y="170" text-anchor="middle" fill="#bfeaff" font-size="12">科技 · 幅度轴</text>
    <text x="303" y="188" text-anchor="middle" fill="#7fb8d8" font-size="10">时长·百分比·个数</text>

    <line x1="99" y1="202" x2="164" y2="252" stroke="#6fb8ff" stroke-width="2" marker-end="url(#arrC)"/>
    <line x1="303" y1="202" x2="238" y2="252" stroke="#6fb8ff" stroke-width="2" marker-end="url(#arrC)"/>

    <rect x="58" y="252" width="234" height="56" rx="6" fill="#102a40" stroke="#3df0ff" stroke-width="2" filter="url(#glow)"/>
    <text x="175" y="276" text-anchor="middle" fill="#eafcff" font-size="13">相乘式增长</text>
    <text x="175" y="296" text-anchor="middle" fill="#9fe0ff" font-size="11">效果 = 机制 × 幅度</text>

    <rect x="22" y="328" width="306" height="62" rx="6" fill="#0c1a2c" stroke="#244a6e" stroke-width="1.2"/>
    <text x="34" y="346" fill="#9fd8ff" font-size="10">适用：分形 / 缓滞 / 疾风 / 广域 / 磁吸</text>
    <text x="34" y="362" fill="#9fd8ff" font-size="10">英雄：蜃影 · 脉冲 · 折光（走方式 A）</text>
    <text x="34" y="380" fill="#cfeaff" font-size="10">例：蜃影 P4 分裂2颗 + 蜂拥分形6s→9s</text>
    <text x="34" y="394" fill="#cfeaff" font-size="10">→ 球更多 且 每颗更持久</text>
  </g>

  <!-- ===== 列 B：共用计数池 ===== -->
  <g>
    <rect x="352" y="80" width="306" height="34" rx="6" fill="#2a1c08" stroke="#ffb454" stroke-width="2" filter="url(#glow)"/>
    <text x="505" y="102" text-anchor="middle" fill="#ffb454" font-size="14">B. 共用计数池（同轴合成）</text>

    <rect x="364" y="148" width="130" height="54" rx="6" fill="#2a1c08" stroke="#ffb454" stroke-width="1.5"/>
    <text x="429" y="170" text-anchor="middle" fill="#ffd9a0" font-size="12">相位 · 蓄力穿透</text>
    <text x="429" y="188" text-anchor="middle" fill="#d8a86a" font-size="10">喂同一池</text>

    <rect x="568" y="148" width="130" height="54" rx="6" fill="#2a1c08" stroke="#ffb454" stroke-width="1.5"/>
    <text x="633" y="170" text-anchor="middle" fill="#ffd9a0" font-size="12">科技 · 裂穿</text>
    <text x="633" y="188" text-anchor="middle" fill="#d8a86a" font-size="10">喂同一池</text>

    <line x1="429" y1="202" x2="494" y2="248" stroke="#ffb454" stroke-width="2" marker-end="url(#arrA)"/>
    <line x1="633" y1="202" x2="568" y2="248" stroke="#ffb454" stroke-width="2" marker-end="url(#arrA)"/>

    <rect x="430" y="248" width="210" height="44" rx="6" fill="#33240c" stroke="#ffb454" stroke-width="2" filter="url(#glow)"/>
    <text x="535" y="275" text-anchor="middle" fill="#ffe2b0" font-size="13">同一穿透计数池</text>

    <line x1="535" y1="292" x2="535" y2="320" stroke="#ffb454" stroke-width="2" marker-end="url(#arrA)"/>

    <rect x="430" y="320" width="210" height="48" rx="6" fill="#2a1c08" stroke="#ffb454" stroke-width="2"/>
    <text x="535" y="342" text-anchor="middle" fill="#eafcff" font-size="12">合成 1 个穿透资源</text>
    <text x="535" y="360" text-anchor="middle" fill="#ffd9a0" font-size="11">不分别双算</text>

    <rect x="352" y="382" width="306" height="44" rx="6" fill="#1c1306" stroke="#5a4318" stroke-width="1.2"/>
    <text x="364" y="400" fill="#ffd9a0" font-size="10">仅：裂穿穿透 ｜ 英雄：裂痕（走方式 B）</text>
    <text x="364" y="418" fill="#ffe2b0" font-size="10">例：P4 释放2次 + 深钻裂穿3次 → 喂同一池，≠ 2+3=5</text>
  </g>

  <!-- 底部通用规则 -->
  <text x="340" y="446" text-anchor="middle" fill="#7fa8c8" font-size="10">两层各自独立预算：相位走 Φ 曲线 ／ 科技每槽净偏移 +30 — 分开配平、各自封顶、组合输出，不无限叠加</text>
</svg>
